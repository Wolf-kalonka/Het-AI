name: Run Chess Bot

on:
  push:
    branches: [ main, master ]  # Запуск при пуше в главную ветку
  schedule:
    - cron: '*/20 * * * *'       # Перезапуск каждые 20 минут (на случай если зависнет/упадет)
  workflow_dispatch:            # Позволяет запускать бота вручную кнопкой

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
    - name: Проверка кода (Checkout)
      uses: actions/checkout@v4

    - name: Настройка Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Установка зависимостей
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Запуск шахматного бота
      env:
        # Передаем наш секрет внутрь скрипта Python как переменную окружения
        LICHESS_TOKEN: ${{ secrets.LICHESS_TOKEN }}
      run: python my_bot.py
